[build-system]
requires = ["scikit-build-core>=0.10", "pybind11[global]>=2.12", "numpy", "wheel"]
build-backend = "scikit_build_core.build"

[project]
name = "nusquids"
version = "1.12.1"          # keep in sync with your Makefile
description = "Neutrino propagation library with pybind11 bindings for reference see"
authors = [{name = "Carlos A. Argüelles Delgado", email = "carguelles@fas.harvard.edu"}]
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
plot = ["matplotlib"]

[tool.scikit-build]
minimum-version = "0.11"
wheel.expand-macos-universal-tags = true
